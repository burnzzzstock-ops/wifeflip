<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#128a5c" />
  <title>Flipping Friend</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flipping Friend" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 12a8.2 8.2 0 0 1 13.9-5.9"/><path d="M17.7 2.6v3.5h-3.5"/><path d="M20.2 12a8.2 8.2 0 0 1-13.9 5.9"/><path d="M6.3 21.4v-3.5h3.5"/><path d="M12 8.3v7.4"/><path d="M13.9 9.9c-.35-.6-1-.95-1.9-.95-1.05 0-1.9.55-1.9 1.35 0 1.8 3.8.95 3.8 2.75 0 .8-.85 1.35-1.9 1.35-.9 0-1.55-.35-1.9-.95"/></svg></span>
      <span class="brand-name">Flipping Friend</span>
    </div>
    <div class="header-actions">
      <button class="sync-chip" id="syncChip" hidden aria-label="Sync status"></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h9"/><path d="M19.5 7.5h.5"/><circle cx="16" cy="7.5" r="2.2"/><path d="M4 16.5h.5"/><path d="M11 16.5h9"/><circle cx="8" cy="16.5" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"><!-- views render here --></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="dashboard">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 10.2 8.5-6.7 8.5 6.7"/><path d="M5.5 8.8V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V8.8"/><path d="M9.75 21v-5.5h4.5V21"/></svg></span>
      <span class="tab-label">Home</span>
    </button>
    <button class="tab" data-route="inventory">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16.2V7.8a1 1 0 0 0-.53-.88l-8-4.27a1 1 0 0 0-.94 0l-8 4.27a1 1 0 0 0-.53.88v8.4a1 1 0 0 0 .53.88l8 4.27a1 1 0 0 0 .94 0l8-4.27a1 1 0 0 0 .53-.88Z"/><path d="m3.3 7.3 8.7 4.7 8.7-4.7"/><path d="M12 12v9.3"/></svg></span>
      <span class="tab-label">Items</span>
    </button>
    <button class="tab tab-primary" data-route="capture" aria-label="Add an item">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
      <span class="tab-label">Add</span>
    </button>
    <button class="tab" data-route="sourcing">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.3-4.3"/></svg></span>
      <span class="tab-label">Sourcing</span>
    </button>
    <button class="tab" data-route="insights">
      <span class="tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20.5h16"/><path d="M7 16.5v-4"/><path d="M12 16.5V7"/><path d="M17 16.5v-6.5"/></svg></span>
      <span class="tab-label">Insights</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
